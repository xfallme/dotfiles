general.import = [
  "~/.config/alacritty/catppuccin-macchiato.toml"
]

general.live_config_reload = true

[env]
TERM = "xterm-256color"

[cursor]
style = "Block"
unfocused_hollow = true

[font]
size = 18.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
blur = true
decorations = "Buttonless"
dynamic_title = true
opacity = 0.7
startup_mode = "Maximized"

[window.padding]
x = 10
y = 10
